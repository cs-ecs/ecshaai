<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ECSHA AI Advisory</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#222;
}

/* HEADER */
header{
    display:flex;
background:#004494;
padding:16px 25px;
color:#fff;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.logo{
    font-size: 32px;
    font-weight: 700;
}
.topbar{
display:flex;
margin-left: auto;
width: 70%;
gap:15px;
justify-content: center;
align-items:center;
}
.topbar input{
flex:1;
padding:12px;
border:none;
max-width: 700px;
border-radius:8px;
font-size:15px;
}
.topbar button{
padding:12px 18px;
background:#ffd617;
border:none;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

/* TABS */
.tabs{
display:flex;
gap:10px;
padding:0 20px;
background:#fff;
border-bottom:1px solid #ddd;
overflow:auto;
}
.tabs button{
padding:15px 18px;
background:none;
border:none;
font-size:15px;
cursor:pointer;
font-weight:700;
color:#444;
border-bottom:3px solid transparent;
white-space:nowrap;
}
.tabs button.active{
color:#004494;
border-color:#ffd617;
}

/* LAYOUT */
.wrapper{
display:flex;
min-height:calc(100vh - 110px);
}

/* SIDEBAR */
.sidebar{
width:240px;
background:#fff;
border-right:1px solid #ddd;
padding:18px;
}
.sidebar h3{
font-size:28px;
color:#004494;
margin-bottom:18px;
}
.sidebar button{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#eef2f8;
cursor:pointer;
text-align:left;
font-weight:700;
font-size:15px;
}
.sidebar button.active{
background:#004494;
color:#fff;
}

/* CONTENT */
.content{
flex:1;
padding:25px;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:16px;
margin-bottom:20px;
}
.card{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.card h4{
font-size:14px;
color:#666;
margin-bottom:12px;
}
.card p{
font-size:32px;
font-weight:800;
color:#004494;
}

/* PANELS */
.panel{
background:#fff;
padding:24px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
margin-bottom:20px;
}
.panel h2{
font-size:22px;
color:#004494;
margin-bottom:18px;
}

/* GRID */
.main-grid{
display:grid;
grid-template-columns:380px 1fr;
gap:20px;
}

/* FORM */
label{
display:block;
font-weight:700;
font-size:14px;
margin-bottom:6px;
margin-top:10px;
}
input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:14px;
}
textarea{
height:100px;
resize:vertical;
}
.submit-btn{
margin-top:18px;
width:100%;
padding:14px;
background:#004494;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:700;
cursor:pointer;
}
.submit-btn:hover{
background:#00306e;
}

/* RESULTS */
.result-box{
background:#eef7ff;
border-left:5px solid #22c55e;
padding:18px;
border-radius:10px;
margin-bottom:16px;
}
.result-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}
.result-card{
padding:18px;
border:1px solid #eee;
border-radius:10px;
background:#fff;
}
.result-card h4{
margin-bottom:10px;
color:#004494;
}

.loading{
display:none;
text-align:center;
padding:40px;
font-size:22px;
font-weight:700;
color:#004494;
}

/* MOBILE */
@media(max-width:1000px){
.wrapper{flex-direction:column}
.sidebar{width:100%;border-right:none;border-bottom:1px solid #ddd}
.main-grid{grid-template-columns:1fr}
.result-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
    <div class="logo">Ask ECSHA</div>
<div class="topbar">
<input type="text" placeholder="Search services...">
<button>Search</button>
</div>
</header>

<!-- TABS -->
<div class="tabs">
<button class="active" onclick="switchTab('dashboard',this)">Dashboard</button>
<button onclick="switchTab('advisory',this)">AI Advisory</button>
<button onclick="switchTab('market',this)">Market</button>
<button onclick="switchTab('reports',this)">Reports</button>
<button onclick="switchTab('settings',this)">Settings</button>
</div>

<div class="wrapper">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>Services</h3>

<button class="active" onclick="openService('Crop Advisory',this)">🌱 Crop Advisory</button>
<button onclick="openService('Disease Detection',this)">🦠 Disease Detection</button>
<button onclick="openService('Soil Intelligence',this)">🌍 Soil Intelligence</button>
<button onclick="openService('Irrigation Planner',this)">💧 Irrigation Planner</button>
<button onclick="openService('Yield Forecast',this)">📈 Yield Forecast</button>
<button onclick="openService('Market Rates',this)">💰 Market Rates</button>

</div>

<!-- MAIN CONTENT -->
<div class="content" id="mainContent"></div>

</div>

<script>
const pages = {

/* DASHBOARD */
dashboard: `
<div class="cards">
<div class="card"><h4>Active Users</h4><p>1,254</p></div>
<div class="card"><h4>AI Queries</h4><p>8,942</p></div>
<div class="card"><h4>Success Rate</h4><p>97%</p></div>
<div class="card"><h4>Today Advisory</h4><p>642</p></div>
</div>

<div class="panel">
<h2>Dashboard</h2>
<p>Welcome to ECSHA AI Agriculture Dashboard.</p>
</div>
`,

/* ADVISORY */
advisory: `
<div class="main-grid">

<div class="panel">
<h2 id="serviceTitle">Crop Advisory Form</h2>

<form id="advisoryForm">

<label>Crop Name</label>
<input type="text" id="crop" placeholder="Ex: Matti Banana">

<label>Location / Pincode</label>
<input type="text" id="location" value="629602">

<label>Growth Stage</label>
<select>
<option>Seed Stage</option>
<option>Vegetative</option>
<option>Flowering</option>
<option>Harvest</option>
</select>

<label>Issue / Requirement</label>
<textarea id="issue"></textarea>

<button class="submit-btn">Generate AI Advisory</button>

</form>
</div>

<div class="panel">
<h2>AI Result Panel</h2>

<div class="loading" id="loading">
Generating Advisory...
</div>

<div id="result">

<div class="result-box">
<h3>Welcome</h3>
<p>Enter crop details and generate advisory.</p>
</div>

</div>

</div>

</div>
`,

/* MARKET */
market: `
<div class="cards">
<div class="card"><h4>Banana</h4><p>₹42/kg</p></div>
<div class="card"><h4>Coconut</h4><p>₹31</p></div>
<div class="card"><h4>Rice</h4><p>₹58/kg</p></div>
<div class="card"><h4>Tomato</h4><p>₹26/kg</p></div>
</div>

<div class="panel">
<h2>Live Market Rates</h2>
<p>Daily updated mandi rates.</p>
</div>
`,

/* REPORTS */
reports: `
<div class="panel">
<h2>Reports Center</h2>
<p>Generate reports and export analytics.</p>
<br>
<button class="submit-btn">Download Monthly Report</button>
</div>
`,

/* SETTINGS */
settings: `
<div class="panel">
<h2>Settings</h2>

<label>Company Name</label>
<input type="text" value="ECSHA AI">

<label>Theme</label>
<select>
<option>Light</option>
<option>Dark</option>
</select>

<label>Email Alerts</label>
<select>
<option>Enabled</option>
<option>Disabled</option>
</select>

<button class="submit-btn">Save Settings</button>
</div>
`
};

/* TAB SWITCH */
function switchTab(tab,btn){
document.querySelectorAll(".tabs button").forEach(x=>{
x.classList.remove("active");
});
btn.classList.add("active");

document.getElementById("mainContent").innerHTML = pages[tab];

if(tab==="advisory"){
bindForm();
}
}

/* SIDEBAR */
function openService(name,btn){

document.querySelectorAll(".sidebar button").forEach(x=>{
x.classList.remove("active");
});
btn.classList.add("active");

document.querySelectorAll(".tabs button").forEach(x=>{
x.classList.remove("active");
});
document.querySelectorAll(".tabs button")[1].classList.add("active");

document.getElementById("mainContent").innerHTML = pages.advisory;

setTimeout(()=>{
document.getElementById("serviceTitle").innerText = name + " Form";
bindForm();
},100);
}

/* FORM FUNCTION */
function bindForm(){

const form = document.getElementById("advisoryForm");
if(!form) return;

form.onsubmit = function(e){
e.preventDefault();

let crop = document.getElementById("crop").value || "Selected Crop";
let location = document.getElementById("location").value || "Unknown";
let issue = document.getElementById("issue").value || "General Need";

document.getElementById("loading").style.display="block";
document.getElementById("result").style.display="none";

setTimeout(()=>{

document.getElementById("loading").style.display="none";
document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML = `
<div class="result-box">
<h3>🌱 ${crop} Advisory Ready</h3>
<p><strong>Location:</strong> ${location}</p>
</div>

<div class="result-grid">

<div class="result-card">
<h4>Indian Recommendation</h4>
<p>Use split fertilizer method, weekly pest checks and drip irrigation.</p>
</div>

<div class="result-card">
<h4>Global Recommendation</h4>
<p>Use smart irrigation and predictive disease alerts.</p>
</div>

</div>

<div class="result-card">
<h4>Detected Need</h4>
<p>${issue}</p>
</div>
`;

},1500);

};
}

/* DEFAULT LOAD */
window.onload = function(){
document.getElementById("mainContent").innerHTML = pages.dashboard;
};
</script>

</body>
</html>
